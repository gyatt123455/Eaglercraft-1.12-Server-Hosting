# 
# Redstone auto-crafting: a dispenser that forms part of an Enhanced Crafting Table, Magic Workbench or
# Armor Forge crafts its recipe headlessly when powered by redstone (the multiblock's owner is the first
# player to build/interact with it).
options:
  auto-update: true
  metrics-service: true
  chat-prefix: '&a&lSlimefun 5&7> '
  armor-update-interval: 10
  enable-armor-effects: true
  enable-radiation: true
  radiation-update-interval: 1
  radiation-grace-period: 15
  rainbow-armor-update-interval: 3
  auto-save-delay-in-minutes: 10
  legacy-ore-washer: false
  legacy-dust-washer: false
  legacy-ore-grinder: true
  language: en
  enable-translations: true
  log-duplicate-block-entries: true
  burn-players-when-radioactive: true
  drop-excess-sf-give-items: false
  backup-data: true
  drop-block-creative: true
  give-guide-on-first-join: true
  print-out-loading: false
  print-out-github-data-retrieving: false
  prefix: '&a&lSlimefun &7>'
  show-vanilla-recipes-in-guide: true
  allow-free-creative-research: true
  emerald-enchantment-limit: 2
  research-unlock-fireworks: true
  research-give-fireworks: true
auto-craft:
  bypass-research: false
  sound:
    everyone: true
    manual: true
storage:
  backend: h2
  mysql:
    host: localhost
    port: 3306
    database: slimefun
    username: root
    password: ''
    extra-params: useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8
guide:
  show-vanilla-recipes: true
  receive-on-first-join: true
  show-hidden-item-groups-in-search: false
  categorize-main-menu: true
  external-links: true
  wiki-url-template: https://slimefun5.github.io/wiki/%plugin%/%id%
  settings-buttons:
    credits: true
    versions: true
    source: true
    discord: true
    installer: true
    bug-reports: true
    config-editor: true
  show-addon-installer-to-everyone: true
  installer:
    use-plugin-names: false
  dump-menu-baseline: false
  cheat-sheet:
    allow-creative: false
    allow-op: true
    allow-permission: true
    allow-everyone: false
  default-view-book: false
bug-reports:
  enabled: true
  relay-url: https://slimefun5-bot.finn-089.workers.dev/report
  cooldown-seconds: 60
  github:
    token: ''
    owner: Slimefun5
  discord:
    webhook-url: ''
config-editor:
  enabled: true
installer:
  github-token: ''
researches:
  free-in-creative-mode: true
  enable-fireworks: true
  disable-learning-animation: false
URID:
  info-delay: 3000
  custom-ticker-delay: 10
  enable-tickers: true
networks:
  max-size: 200
  cargo-ticker-delay: 0
  enable-visualizer: true
  delete-excess-items: false
talismans:
  use-actionbar: true
metrics:
  auto-update: true
  analytics: true
  disable-addon-metrics: true
translation:
  packets: true
  fallback: english
  language-source: client
research-ranks:
- Chicken
- Cow
- Spider
- Villager
- Beginner
- Clumsy Student
- Unskilled Student
- Incompetent Student
- Student
- Clumsy Apprentice
- Apprentice
- Skilled Apprentice
- Upcoming Mage
- Excellent Mage
- Young Magician
- Incompetent Magician
- Common Magician
- Magician
- Proficient Magician
- Skilled Magician
- Accustomed Magician
- Great Magician
- Clumsy Wizard
- Wizard
- Common Wizard
- Skilled Wizard
- Great Wizard
- Impressive Wizard
- Young Master
- Clumsy Master
- Upcoming Master
- Competent Master
- Master
- Skilled Master
- Excellent Master
- Great Master
- Proficient Master
- The Chosen One
items:
  talismans: true
  coolers: true
  backpacks: true
